[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevkit"
version = "0.1.0"
description = "Decision kernel for TypeSafe Jev (System One): typed questions, bands, state building, composition."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["jevkit*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
